license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="dimensiontab.png"
authors="skd"
description='''
Adds the dimension that a user is currently in to the tab list for easy access.

This is a server-side mod and therefore does not need to be installed on the client.
Features:
- Shows current dimension in the tab list
- Customizable colors per dimension (Overworld, Nether, End, modded)
- Dimension aliases (custom names)
- Configurable display format and position (prepend/append)
- In-game commands for runtime configuration: /dimensiontab
'''

displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="dimensiontab.mixins.json"

[[mixins]]
config="dimensiontab.neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
